name: Publish branch build

# Temporary, not for merging. Publishes a plain build of main so "latest" on CDP matches main
# while PR FLS2-499 is reviewed. Delete the branch afterwards.
on:
  push:
    branches:
      - chore/republish-main
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  pull-requests: write

env:
  AWS_REGION: eu-west-2
  AWS_ACCOUNT_ID: '094954420758'

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Build the test suite
        uses: DEFRA/cdp-build-action/build-test@7fe324bec9987c5a4d0f4724b42e30c282892ceb # main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
