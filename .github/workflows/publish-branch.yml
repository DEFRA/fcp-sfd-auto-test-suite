name: Publish branch build

# Temporary: publishes a prerelease image from this branch so the suite can be run on CDP
# before merging. Delete this file before the PR is merged.
on:
  push:
    branches:
      - feature/FLS2-499-playwright-browserstack
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  pull-requests: write

env:
  AWS_REGION: eu-west-2
  AWS_ACCOUNT_ID: '094954420758'

jobs:
  build:
    name: Build and publish prerelease
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Build the test suite
        uses: DEFRA/cdp-build-action/build-test@7fe324bec9987c5a4d0f4724b42e30c282892ceb # main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: 'true'
          prerelease-suffix: pw
