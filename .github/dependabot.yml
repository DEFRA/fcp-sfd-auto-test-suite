---
version: 2
updates:
  - package-ecosystem: docker-compose
    directory: '/'
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    open-pull-requests-limit: 5
    groups:
      docker-security:
        applies-to: security-updates
        patterns:
          - '*'
      docker-non-security:
        applies-to: version-updates
        patterns:
          - '*'
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: daily
    commit-message:
      prefix: chore
    # BrowserStack only supports Android for Playwright 1.59 and 1.62 (not 1.63+).
    # Review https://www.browserstack.com/docs/automate/playwright/browsers-and-os before lifting this.
    ignore:
      - dependency-name: playwright
        versions: ['>=1.63.0']
      - dependency-name: '@playwright/test'
        versions: ['>=1.63.0']
    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - '*'
      lint:
        applies-to: version-updates
        patterns:
          - eslint
          - eslint-*
          - prettier
      tools:
        applies-to: version-updates
        patterns:
          - husky
      types:
        applies-to: version-updates
        patterns:
          - '@types/*'
      npm-production:
        applies-to: version-updates
        dependency-type: production
        patterns:
          - '*'
      npm-development:
        applies-to: version-updates
        dependency-type: development
        patterns:
          - '*'
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      github-actions-security:
        applies-to: security-updates
        patterns:
          - '*'
      github-actions-non-security:
        applies-to: version-updates
        patterns:
          - '*'
